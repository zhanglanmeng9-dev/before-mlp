window.BeforeStories = [{"id":1,"title":"她没有辞职，先去别人的城市住了三天","meta":"年轻人｜M048 实物期权","paragraphs":["周予总说，等攒够钱就去大理住半年。她收藏了很多民宿，知道哪条街下午有阳光，甚至连附近的菜市场都看过攻略。可真有人问她什么时候走，她又会笑着说：“再等等吧，工作也不能说辞就辞。”","她怕的不是陌生城市，而是自己花了很多钱、放弃了稳定生活，最后发现只是喜欢别人镜头里的旅居。于是她没有递辞职信，只请了两天年假，带着电脑住进一家月租民宿。白天，她坐在窗边处理工作；傍晚，和其他住客一起去买菜；晚上，房间安静下来，她才发现自己并没有想象中那么自由——她还是会焦虑消息、担心进度，也会在陌生的街上不知道该和谁说话。","第三天离开时，她没有得到“我要不要旅居”的答案，却写下了一张清单：她喜欢一个人走路，喜欢没有通勤的早晨；但不喜欢没有固定收入时的慌张，也不想永远一个人吃饭。","回程的高铁上，她把“辞职去旅居”改成了“先远程工作一个月，再决定下一步”。原来有些人生不必一次性押上全部。先让自己进去待一会儿，听听真实生活会怎么回答。"],"concept":"M048 实物期权","insight":"面对投入大、退出难的选择，可以先设计一次成本可控的小体验，换取真实信息，而不是只在想象里做决定。三天旅居不能代表半年后的生活，但能帮助她分辨自己究竟在向往什么。","question":"如果不必立刻改变人生，你能不能先为它留出一次小小的试住？"},{"id":2,"title":"她删掉了五十条攀岩攻略","meta":"年轻人｜M018 信息价值","paragraphs":["林见想去攀岩馆已经半年了。她收藏夹里有“攀岩新手装备清单”“第一次抱石要注意什么”“女生攀岩穿搭”，还看过很多人说第一次去最好找朋友陪。但她身边没有人攀岩，于是每次点开预约页面，最后都会退出。","她以为自己缺的是更多攻略。后来有一天，她刷到一条攀岩馆的体验课信息，里面写着：第一次来不用自带装备，会有教练带热身，也可以一个人报名。她盯着那行字看了很久，忽然发现自己真正想知道的，不是“攀岩难不难”，而是“我一个人走进去，会不会很尴尬”。","周末下午，她还是去了。鞋不合脚，第一条线也没爬上去。可教练没有催她，旁边的人也没有像她想象中那样盯着她看。结束后，她坐在馆门口喝水，手指有点发酸，却第一次觉得自己离答案近了一点。","回家后，她没有马上买年卡，也没有把“成为攀岩爱好者”写进计划表。她只在备忘录里记了一句：我不讨厌这里，下次可以再来一次。"],"concept":"M018 信息价值","insight":"当你已经看了很多信息却仍然无法行动时，问题可能不是信息不够，而是这些信息没有回答你最在意的那个问题。一次真实体验，往往比继续收藏更多攻略更有价值。","question":"你现在最想确认的，到底是哪一个只有亲自试过才能回答的问题？"},{"id":3,"title":"她不再问“AI 到底该怎么学”","meta":"年轻人｜M017 信息增益","paragraphs":["蒋宁想成为“很会用 AI 的人”。她报过提示词课程，下载过很多工具，也存了十几个“AI 入门路线图”。每张图都很完整：先学模型，再学工作流，再学数据处理。她越看越慌，因为每一条路都像要花很久，而她不知道自己到底该从哪一条开始。","直到一次小组访谈结束，桌上堆着六段录音和一沓乱七八糟的便签。大家都说“之后再整理”，她却突然想：如果 AI 真能帮我做一件事，我最希望它先帮我做什么？","她没有再搜索“AI 学习路线”，而是把一段访谈录音转成文字，试着让 AI 帮她标出受访者反复提到的词。第一次结果很乱，很多句子也被理解错了。她又补充了访谈背景和自己的分类标准，第二次终于得到一张能继续修改的表。","那天晚上，她还是不会编程，也没弄懂所有模型名词。但她第一次知道，自己并不是想“学会 AI”，而是想让它帮她从混乱的信息里找到线索。这个问题比“我该从哪学起”小得多，却替她打开了第一扇门。"],"concept":"M017 信息增益","insight":"面对很多可能方向时，不一定要先找到全部答案。先提出一个能明显缩小范围的问题，往往更有用。对蒋宁来说，“AI 能先帮我解决什么具体麻烦”比“AI 应该怎么学”更能带来下一步。","question":"如果只能先问一个问题，哪个问题最能帮你排除暂时不需要走的路？"},{"id":4,"title":"她去当了一天“舞台边上的人”","meta":"年轻人｜M037 期望价值","paragraphs":["陈宜一直想去看地下偶像演出。她喜欢舞台、灯光和人群一起喊应援词的感觉，却又觉得这件事“不够实际”。身边的人都在准备实习、考证、投简历，她不太好意思说，自己想知道站在舞台附近会是什么感觉。","有次活动在周末招志愿者，负责发手环、引导观众入场。朋友问她：“做这个能得到什么？”她算了算，要花一个下午，还得自己坐地铁过去，最后可能只换来一张工作人员证和一点疲惫。可她也写下了另一边：她能看见演出后台是怎么运转的，能知道自己喜欢的是舞台本身、表演的人，还是只是网络上热闹的想象。","那天下午，她站在入口处重复说了很多遍“这边检票”。结束后，她帮忙收宣传页，看到一位表演者坐在地上卸妆，旁边放着没喝完的矿泉水。她突然明白，舞台没有她想象中那么遥远，也没有那么轻松。","回家路上，她没有决定以后要不要做偶像相关工作。她只是知道，自己喜欢现场的能量，却不喜欢长时间处在人群中心。这个答案看起来很小，但它不是别人替她讲的，是她亲自站在那里得到的。"],"concept":"M037 期望价值","insight":"一次尝试是否值得，不只看它能不能立刻变现或产生确定结果，也要看它可能带来的体验、信息、联系和后续选择空间。当然，前提是成本在自己能承受的范围内。","question":"这次尝试除了“成功或失败”，还可能给你留下什么？"},{"id":5,"title":"他把 Unity 学习计划缩成了一盏会亮的灯","meta":"年轻人｜M045 鲁棒计划","paragraphs":["程野下班后总想学 Unity。他给自己做过一份很漂亮的计划：周一看教程，周二学 C#，周三做场景，周末完成一个小游戏。第一周，他还认真打卡；第二周加班两天；第三周，他看到桌面的 Unity 图标就开始内疚。","他一直以为是自己不够自律。后来一个周四晚上，他回到家已经九点半，外卖还没吃完，脑子里只剩下“今天又学不了了”。他盯着计划表看了一会儿，把“完成一节课程”划掉，改成了“打开 Unity，让灯亮起来”。","那晚他只花了二十分钟：新建场景，放一个方块，改了颜色，又让一盏灯慢慢变亮。它看起来很简单，甚至有点傻，但他没有关掉软件。他又试着把灯调成忽明忽暗，像深夜楼道里坏掉的感应灯。","之后，他没有要求自己每天进步很多，只把每次任务改成普通工作日也能完成的大小。有时是一盏灯，有时是一个会移动的方块，有时只是把昨天的文件打开看一眼。一个月后，他还没有做出游戏，却有了五个小场景。"],"concept":"M045 鲁棒计划","insight":"好的计划不该只在“状态最好的一周”成立，也要能容纳加班、疲惫和临时状况。把任务缩小，不是降低目标，而是让计划在普通生活里也能继续推进。","question":"如果按你最疲惫的那个晚上来安排，你的第一步可以缩小到什么程度？"},{"id":6,"title":"她暂停了那门已经学了三周的课","meta":"年轻人｜M040 沉没成本与增量决策","paragraphs":["许知遥从高中起就觉得法医很酷。大学后，她花了不少钱报了一门法医学导论课，还提前买了笔记本和一套荧光色标签。前两周，她看纪录片、记专业名词，觉得自己离那个想象中的方向越来越近。","第三周开始，课程进入法医学报告和证据流程。她发现自己并不讨厌案件推理，但一看到长长的技术规范就很难集中注意力。她告诉自己：“都学到这里了，再坚持一下吧。”于是她一边拖着不看课，一边因为拖延更觉得自己不够认真。","有天晚上，她打开进度条，发现后面还有二十多个小时。她突然问自己：如果今天才看到这门课，我还愿意花接下来的二十个小时继续吗？答案不是完全不愿意，而是她更想接触案例分析和法律逻辑，而不是逼自己完成所有章节。","她没有把课程删除，而是暂停了。之后，她找了一次模拟案例分析活动，花一个晚上读材料、整理时间线。结束时，她依然不确定未来会不会走向法律或法医，但她终于把“我已经花了钱”与“我接下来想不想花时间”分开了。"],"concept":"M040 沉没成本与增量决策","insight":"已经花出去的钱和时间，未必能通过继续投入而回来。决定是否继续时，更应该看从现在开始还要付出什么、可能得到什么，以及自己真正想验证的是什么。","question":"如果今天才遇见这条路，你还愿意为它投入接下来的时间吗？"}];

render = function() {
  if (route === 'stories') app.innerHTML = storyListPage();
  else if (route === 'story') app.innerHTML = storyDetailPage();
  else if (route === 'experience') app.innerHTML = experienceDetailPage();
  else originalRender();
};

document.addEventListener('input', event => {
  if (event.target.id !== 'video-explore-search') return;
  directionSearch = event.target.value;
  document.querySelector('#video-direction-list').innerHTML = directionCards();
});
document.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const [action,...rest] = target.dataset.action.split(':');
  const value = rest.join(':');
  if (action === 'open-story') { storyId=Number(value); storyReturn=route; go('story'); }
  else if (action === 'return-story') window.beforeBack();
  else if (action === 'bookmark-story') { const id=Number(value); state.storyBookmarks=state.storyBookmarks.includes(id) ? state.storyBookmarks.filter(x=>x!==id) : [...state.storyBookmarks,id]; save(); render(); }
  else if (action === 'save-story-note') { const note=document.querySelector('#story-note').value.trim(); state.storyNotes[storyId]=note; if (note) state.records.unshift({id:String(Date.now()),text:note,date:new Date().toLocaleString('zh-CN'),planId:null}); save(); toast('已保存到本机记录'); }
  else if (action === 'open-experience') { experienceId=value; experienceTab='任务'; go('experience'); }
  else if (action === 'experience-tab') { experienceTab=value; render(); }
  else if (action === 'start-experience') { const work=workFor(experienceId); work.started=true; work.paused=false; save(); render(); toast('已加入计划，开始第一步吧'); }
  else if (action === 'pause-experience') { const work=workFor(experienceId); work.paused=!work.paused; save(); render(); toast(work.paused ? '已暂停，进度已保存' : '已继续体验'); }
  else if (action === 'toggle-experience-step') { const work=workFor(experienceId); const index=Number(value); work.started=true; work.paused=false; work.done=work.done.includes(index) ? work.done.filter(n=>n!==index) : [...work.done,index].sort((a,b)=>a-b); save(); render(); }
  else if (action === 'skip-story') { toast('好的，先继续手上的体验'); }
});
document.addEventListener('submit', event => {
  if (event.target.id !== 'experience-reflection') return;
  event.preventDefault();
  workFor(experienceId).reflection=String(new FormData(event.target).get('reflection') || '').trim();
  save(); toast('记录已保存');
});
render();
